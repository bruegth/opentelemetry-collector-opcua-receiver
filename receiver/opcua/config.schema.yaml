type: object
description: OPC UA receiver configuration
properties:
  endpoint:
    type: string
    description: OPC UA server endpoint URL (e.g., opc.tcp://localhost:4840)
    pattern: ^opc\.tcp://.*

  security_policy:
    type: string
    description: Security policy to use
    enum:
      - None
      - Basic256
      - Basic256Sha256
      - Aes128_Sha256_RsaOaep
      - Aes256_Sha256_RsaPss
    default: None

  security_mode:
    type: string
    description: Security mode to use
    enum:
      - None
      - Sign
      - SignAndEncrypt
    default: None

  auth:
    type: object
    description: Authentication configuration
    properties:
      type:
        type: string
        description: Authentication type
        enum:
          - anonymous
          - username_password
          - certificate
        default: anonymous
      username:
        type: string
        description: Username for username_password authentication
      password:
        type: string
        description: Password for username_password authentication
      cert_file:
        type: string
        description: Not used; configure tls.cert_file instead
      key_file:
        type: string
        description: Not used; configure tls.key_file instead

  log_object_paths:
    type: array
    description: LogObject NodeIDs or known ServerLog aliases; arbitrary browse paths are not resolved
    items:
      type: string
    default:
      - Objects/ServerLog
    minItems: 1

  collection_interval:
    type: string
    description: Interval between log collections (e.g., 30s, 1m)
    pattern: ^\d+(ns|us|µs|ms|s|m|h)$
    default: 30s

  max_records_per_call:
    type: integer
    description: Maximum number of records to retrieve per GetRecords call
    minimum: 1
    maximum: 10000
    default: 1000

  filter:
    type: object
    description: Log filtering configuration
    properties:
      min_severity:
        type: string
        description: Minimum severity level to collect
        enum:
          - Trace
          - Debug
          - Info
          - Warn
          - Warning
          - Error
          - Fatal
          - Emergency
        default: Info
      max_log_records:
        type: integer
        description: Currently not enforced
        minimum: 0
        default: 10000

  collection_mode:
    type: string
    description: Poll LogObjects or subscribe to events
    enum: [poll, subscription]
    default: poll

  subscription:
    type: object
    description: Settings for subscription mode
    properties:
      publishing_interval:
        type: string
        description: Requested event publishing interval
        default: 1s
      queue_size:
        type: integer
        description: Monitored-item queue size
        minimum: 0
        default: 100
      reconnect_delay:
        type: string
        description: Delay between reconnect attempts
        default: 5s
      max_reconnect_attempts:
        type: integer
        description: Maximum reconnect attempts; zero means unlimited
        minimum: 0
        default: 0

  connection_timeout:
    type: string
    description: Timeout for establishing connection
    pattern: ^\d+(ns|us|µs|ms|s|m|h)$
    default: 30s

  request_timeout:
    type: string
    description: Timeout for individual requests
    pattern: ^\d+(ns|us|µs|ms|s|m|h)$
    default: 10s

  tls:
    type: object
    description: TLS configuration
    properties:
      insecure_skip_verify:
        type: boolean
        description: Currently not applied to the OPC UA client
        default: false
      ca_file:
        type: string
        description: Currently not applied to the OPC UA client
      cert_file:
        type: string
        description: Path to client certificate file
      key_file:
        type: string
        description: Path to client private key file

  resource:
    type: object
    description: Resource-level OTel attributes emitted with every log record
    properties:
      service_name:
        type: string
        description: Value for the service.name resource attribute
        default: opcua-server
      service_namespace:
        type: string
        description: Value for the service.namespace resource attribute (omitted when empty)

required:
  - endpoint
