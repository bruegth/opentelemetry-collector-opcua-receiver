dist:
  name: otelcol-dev
  description: Basic OTel Collector distribution for Developers
  output_path: ./otelcol-dev
  otelcol_version: 0.166.0

exporters:
  - gomod:
      go.opentelemetry.io/collector/exporter/debugexporter v0.166.0
  - gomod:
      go.opentelemetry.io/collector/exporter/otlpexporter v0.166.0
  # Contrib releases can lag behind Collector core releases.
  - gomod:
      github.com/open-telemetry/opentelemetry-collector-contrib/exporter/fileexporter v0.165.1

processors:
  - gomod:
      go.opentelemetry.io/collector/processor/batchprocessor v0.166.0
  - gomod:
      github.com/open-telemetry/opentelemetry-collector-contrib/processor/filterprocessor v0.165.1

receivers:
  - gomod:
      go.opentelemetry.io/collector/receiver/otlpreceiver v0.166.0
  - import: github.com/bruegth/opentelemetry-collector-opcua-receiver/receiver/opcua
    gomod: github.com/bruegth/opentelemetry-collector-opcua-receiver/receiver/opcua v0.1.0
    path: ./receiver/opcua

providers:
  - gomod:
      go.opentelemetry.io/collector/confmap/provider/envprovider v1.72.0
  - gomod:
      go.opentelemetry.io/collector/confmap/provider/fileprovider v1.72.0
  - gomod:
      go.opentelemetry.io/collector/confmap/provider/httpprovider v1.72.0
  - gomod:
      go.opentelemetry.io/collector/confmap/provider/httpsprovider v1.72.0
  - gomod:
      go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.72.0